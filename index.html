<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Exultant Life Sciences | Coming Soon</title>
<style>
  :root{
    --mint:#3fb68a;
    --gold:#c9a24b;
    --paper:#f6f8f7;
    --muted:#9fb8b3;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(circle at 20% 20%, #103f3a 0%, #081d1b 55%, #050f0e 100%);
    color:var(--paper);
    min-height:100dvh;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    padding:24px;
  }

  .bg-accent{
    position:absolute;
    border-radius:50%;
    filter:blur(60px);
    opacity:0.35;
    pointer-events:none;
  }
  .bg-accent.one{width:min(420px,60vw);height:min(420px,60vw);background:var(--mint);top:-10%;left:-10%;}
  .bg-accent.two{width:min(340px,50vw);height:min(340px,50vw);background:var(--gold);bottom:-10%;right:-10%;opacity:0.22;}
  .bg-accent.three{width:min(260px,40vw);height:min(260px,40vw);background:#0f6b5c;top:40%;right:10%;opacity:0.18;}

  .grid-lines{
    position:absolute;
    inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size:48px 48px;
    pointer-events:none;
  }

  .container{
    position:relative;
    z-index:2;
    width:100%;
    max-width:900px;
    text-align:center;
  }

  .company-name{
    font-size:clamp(18px, 4vw, 34px);
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--mint);
    font-weight:700;
    margin-bottom:clamp(16px, 3vw, 28px);
    word-break:break-word;
  }

  h1{
    font-size:clamp(40px, 10vw, 96px);
    line-height:1.1;
    font-weight:800;
    letter-spacing:-0.01em;
    background:linear-gradient(120deg, #ffffff 0%, #cfe9df 60%, #9fd9bf 100%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
  }

  footer{
    margin-top:clamp(28px, 5vw, 48px);
    font-size:clamp(11px, 1.5vw, 13px);
    color:rgba(159,184,179,0.6);
    letter-spacing:0.04em;
  }
</style>
</head>
<body>

  <div class="bg-accent one"></div>
  <div class="bg-accent two"></div>
  <div class="bg-accent three"></div>
  <div class="grid-lines"></div>

  <div class="container">

    <div class="company-name">exultantlifesciences</div>

    <h1>Cooking our website</h1>

    <footer>
      &copy; 2026 Exultant Life Sciences. All rights reserved.
    </footer>

  </div>

</body>
</html>
